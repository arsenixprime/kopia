<title id="t">Drive quota units per workload - native lane only</title>
<desc id="d">counted from the native backend&#39;s own instrumented transport, median over n=5 trials per lane. rclone spends quota too: it is UNOBSERVED here, not zero, because that traffic leaves through a subprocess the harness cannot instrument. snapshot-e2e is omitted: its quota is estimated from bytes moved rather than counted.</desc>
